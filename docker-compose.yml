# Project name keeps containers, networks and volumes separate from your other Docker projects.
name: tesla-hub

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: tesla
      POSTGRES_PASSWORD: tesla
      POSTGRES_DB: tesla
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5495:5432" # only for local tools / `go run`; not exposed to your network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesla"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  hub:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://tesla:tesla@db:5432/tesla?sslmode=disable
      PRIVATE_KEY_PATH: /app/secrets/private-key.pem
      PUBLIC_KEY_PATH: /app/public-key-site/.well-known/appspecific/com.tesla.3p.public-key.pem
      TELEMETRY_CERTS_DIR: /app/secrets/telemetry
    volumes:
      - ./secrets:/app/secrets:ro
      - ./public-key-site:/app/public-key-site:ro
    ports:
      - "127.0.0.1:8095:8095"
      - "127.0.0.1:8096:8096" # public key only; Tailscale Funnel exposes this one
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Tesla's Fleet Telemetry server. The car connects to it over the internet
  # (Tailscale Funnel forwards public :8443 here) and it republishes decoded
  # records to the hub over ZMQ on the internal network.
  telemetry:
    image: tesla/fleet-telemetry:v0.9.5
    command: ["/fleet-telemetry", "-config=/etc/fleet-telemetry/config.json"]
    volumes:
      - ./telemetry/config.json:/etc/fleet-telemetry/config.json:ro
      - ./secrets/telemetry:/etc/certs:ro
    ports:
      - "127.0.0.1:4443:443"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # view dashboards without logging in (local only)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tesla.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3095:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  grafana-data:
